name: "✨ Feature Request"
description: "Suggest an idea or improvement."
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for suggesting an improvement! Please describe your idea below."
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Why is it valuable?
      placeholder: I'm frustrated when... / It would help if...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false
  - type: input
    id: component
    attributes:
      label: Affected project / component
      description: Which repo or product is this for? (e.g. x402 API, TradeDesk, XRPL Agent)
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
